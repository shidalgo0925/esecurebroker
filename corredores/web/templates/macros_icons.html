{# Inline SVG icons — stroke currentColor, 24 viewBox #}
{% macro icon(name, cls='ico') -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'sun' %}
  <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{%- elif name == 'radar' %}
  <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/><path d="M12 3v4"/>
{%- elif name == 'users' %}
  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
{%- elif name == 'folder' or name == 'folder-plus' %}
  <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
  {%- if name == 'folder-plus' %}<path d="M12 11v6M9 14h6"/>{%- endif %}
{%- elif name == 'coins' %}
  <circle cx="8" cy="8" r="5"/><path d="M16.5 9.5A5 5 0 1 1 9 16.5"/><path d="M8 6v4M6.5 8h3"/>
{%- elif name == 'refresh' %}
  <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
{%- elif name == 'shield' %}
  <path d="M12 3l8 3v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-3z"/>
{%- elif name == 'target' %}
  <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>
{%- elif name == 'scale' %}
  <path d="M12 3v18M5 7h14"/><path d="M5 7l-2 7h4L5 7zM19 7l-2 7h4l-2-7z"/>
{%- elif name == 'share' %}
  <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>
{%- elif name == 'building' %}
  <path d="M4 21V5a1 1 0 0 1 1-1h9v17M14 9h5a1 1 0 0 1 1 1v11M9 8h.01M9 12h.01M9 16h.01M18 13h.01M18 17h.01"/>
{%- elif name == 'percent' %}
  <circle cx="7.5" cy="7.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/><path d="M6 18L18 6"/>
{%- elif name == 'file' %}
  <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9l-5-6z"/><path d="M14 3v6h6"/>
{%- elif name == 'spark' %}
  <path d="M12 2l1.5 6.5L20 10l-6.5 1.5L12 18l-1.5-6.5L4 10l6.5-1.5L12 2z"/>
{%- elif name == 'chart' %}
  <path d="M4 19h16M7 16V9M12 16V5M17 16v-7"/>
{%- elif name == 'gear' %}
  <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1l2.1-2.1M17 7l2.1-2.1"/>
{%- elif name == 'help' %}
  <circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.8 2.1c-.8.5-1.3 1-1.3 2"/><circle cx="12" cy="17" r=".6" fill="currentColor"/>
{%- elif name == 'user-plus' %}
  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>
{%- elif name == 'plus' %}
  <path d="M12 5v14M5 12h14"/>
{%- else %}
  <circle cx="12" cy="12" r="8"/>
{%- endif %}
</svg>
{%- endmacro %}
