{% extends "base.html" %}
{% block title %}Nuevo cliente · ESecureBroker{% endblock %}
{% block topbar %}Cartera · Nuevo cliente{% endblock %}
{% block content %}
<section class="hero-ops">
  <h1>Nuevo cliente</h1>
  <p class="lede">Alta rápida de persona. Luego puedes emitir póliza o cotizar.</p>
</section>
<form method="post" action="/clientes/nuevo" class="wizard-form">
  <label>Nombre <input name="first_name" required /></label>
  <label>Apellido <input name="last_name" required /></label>
  <label>Cédula / RUC <input name="national_id" /></label>
  <label>Teléfono <input name="phone" /></label>
  <div class="wizard-actions">
    <a class="btn-secondary" href="/clientes">Cancelar</a>
    <button class="btn-primary" type="submit">Guardar cliente</button>
  </div>
</form>
{% endblock %}
