<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aceptar invitación · ESecureBroker</title>
  <link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/auth.css?v=20260813inv" />
</head>
<body class="auth-body{% if is_dev_env %} auth-env-dev{% endif %}">
  <div class="auth-stage">
    <div class="auth-login-wrap auth-register-wrap">
      <div class="auth-login-brand">
        <img src="/static/brand/crest.svg" width="44" height="44" alt="" />
        <span class="auth-wordmark">ESecure<span>Broker</span></span>
      </div>
      {% if not valid %}
      <h1 class="auth-title">Invitación no válida</h1>
      <p class="auth-lead">El enlace expiró, ya se usó o fue revocado. Pide un reenvío a tu administrador.</p>
      <a class="auth-cta" href="/login">Ir al login</a>
      {% else %}
      <h1 class="auth-title">Únete a {{ org_name }}</h1>
      <p class="auth-lead">Te invitaron como <strong>{{ role_code|es }}</strong> · {{ email }}</p>
      {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="/invitacion/{{ token }}" class="auth-form">
        <label>Nombre
          <input name="display_name" maxlength="200" placeholder="Tu nombre" />
        </label>
        <label>Contraseña (mín. 8)
          <input name="password" type="password" required minlength="8" autocomplete="new-password" />
        </label>
        <button type="submit" class="auth-cta">Activar acceso</button>
      </form>
      {% endif %}
    </div>
  </div>
</body>
</html>
